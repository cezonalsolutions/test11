<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CEZOO</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap"
rel="stylesheet">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #ffffff;
}

/* TOP NAVIGATION */

.czSimpleTopNav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    padding: 39px 16px 10px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #16a34a;
    border: none;
    box-shadow: none;
    z-index: 99999;
}

.czSimpleNavLogo {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);

    font-family: 'Bungee', sans-serif;
    font-size: 25px;
    font-weight: 400;
    color: #ffffff;

    line-height: 1;
    white-space: nowrap;
}

.czSimpleBackBtn,
.czSimpleChatBtn {
    width: 36px;
    height: 36px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
    border: none;
    padding: 0;
    color: #ffffff;
    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.czSimpleBackBtn i {
    font-size: 19px;
}

.czSimpleChatBtn i {
    font-size: 22px;
}

/* RECEIPT SECTION */

.czReceiptSection {
    margin-top: 85px;
    padding: 14px 12px 25px;

    background: linear-gradient(
        to bottom,
        #16a34a 0%,
        #b1e4bd 100%
    );

    overflow: hidden;
}

/* PRINTER CONTAINER */

.czReceiptPrinter {
    position: relative;
    width: 100%;
    max-width: 550px;
    margin: 0 auto;

    padding-top: 13px;
    isolation: isolate;
}

/* OUTER PRINTER FINISHING */

.czReceiptOuterSlot {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 32px;

    background: rgba(255,255,255,0.15);

    border: 3px solid rgba(255,255,255,0.13);
    border-radius: 12px;

    box-shadow:
        inset 0 3px 5px rgba(255,255,255,0.12),
        0 2px 5px rgba(0,0,0,0.05);

    z-index: 1;
}

/* INNER PRINTER SLOT */

.czReceiptInnerSlot {
    position: absolute;
    top: 8px;
    left: 9px;
    right: 9px;

    height: 16px;

    background: #064321;
    border-radius: 6px;

    box-shadow:
        inset 0 3px 5px rgba(0,0,0,0.65),
        0 1px 2px rgba(255,255,255,0.30);

    z-index: 2;
}

/* PAPER EXIT WINDOW */

.czReceiptPaperWindow {
    position: relative;

    margin: 0 15px;
    padding-bottom: 8px;

    overflow: hidden;
    z-index: 3;
}

/* WHITE RECEIPT PAPER */

.czReceiptPaper {
    position: relative;

    width: 100%;
    height: 280px;

    background: linear-gradient(
        to bottom,
        #d8e4db 0px,
        #f5f8f5 12px,
        #ffffff 25px
    );

    border-radius: 4px 4px 0 0;

    animation: czReceiptPremiumPrint2026
               1.8s
               cubic-bezier(0.25, 0.7, 0.25, 1)
               both;
}

/* REALISTIC ZIGZAG PAPER EDGE */

.czReceiptPaper::after {
    content: "";

    position: absolute;
    top: 100%;
    left: 0;
    right: 0;

    height: 8px;

    background:
        linear-gradient(
            135deg,
            #ffffff 50%,
            transparent 51%
        ) 0 0 / 16px 8px,

        linear-gradient(
            225deg,
            #ffffff 50%,
            transparent 51%
        ) 0 0 / 16px 8px;
}

/* PRINTING ANIMATION */

@keyframes czReceiptPremiumPrint2026 {

    0% {
        transform: translateY(calc(-100% - 8px));
    }

    100% {
        transform: translateY(0);
    }

}

@media (prefers-reduced-motion: reduce) {
    .czReceiptPaper {
        animation: none;
    }
}

</style>

</head>

<body>

<!-- TOP NAVIGATION -->

<div class="czSimpleTopNav">

    <button class="czSimpleBackBtn"
            aria-label="Go back"
            onclick="history.back()">

        <i class="fa-solid fa-arrow-left"></i>

    </button>

    <div class="czSimpleNavLogo">
        CEZOO
    </div>

    <button class="czSimpleChatBtn"
            aria-label="Chat">

        <i class="fa-regular fa-comment-dots"></i>

    </button>

</div>

<!-- RECEIPT PRINTER -->

<div class="czReceiptSection">

    <div class="czReceiptPrinter">

        <div class="czReceiptOuterSlot"></div>

        <div class="czReceiptInnerSlot"></div>

        <div class="czReceiptPaperWindow">

            <div class="czReceiptPaper"></div>

        </div>

    </div>

</div>

</body>
</html>
